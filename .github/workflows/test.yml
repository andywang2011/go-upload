name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Configure private modules
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/andywang2011/*
      - name: Docs — no Han characters
        run: |
          if command -v rg >/dev/null 2>&1; then
            if rg -n '[\p{Han}]' --glob '*.go' --glob '*.md' --glob '*.yml' --glob '!**/examples/**' .; then
              echo "Han characters found; docs must be English-only" >&2
              exit 1
            fi
          else
            python3 - <<'PY'
import pathlib, re, sys
han = re.compile(r'[\u4e00-\u9fff]')
bad = []
for p in pathlib.Path('.').rglob('*'):
    if p.is_dir() or 'examples' in p.parts: continue
    if p.suffix not in {'.go','.md','.yml','.yaml'}: continue
    try: text = p.read_text(encoding='utf-8')
    except Exception: continue
    if han.search(text):
        bad.append(str(p))
if bad:
    print('Han characters in:', *bad, sep='\n  ', file=sys.stderr)
    sys.exit(1)
PY
          fi
      - name: Docs — README headings
        run: |
          python3 - <<'PY'
import pathlib, re, sys
text = pathlib.Path('README.md').read_text(encoding='utf-8')
heads = re.findall(r'^## (.+)$', text, re.M)
want = ['Install', 'Quick start', 'Examples', 'License']
if heads != want:
    print(f'README ## headings must be exactly {want}, got {heads}', file=sys.stderr)
    sys.exit(1)
PY
      - run: go vet ./...
      - run: go test -race -count=1 -cover ./...
